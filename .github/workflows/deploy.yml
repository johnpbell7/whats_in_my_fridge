name: Deploy to Vercel (production)

# Auto-publishes the app to your live Vercel URL whenever main updates, so you
# never have to run `npx vercel --prod` by hand. Requires three repository
# secrets — see DEPLOY.md ("Automatic deploys") for where to get them.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger a deploy manually from the Actions tab

# Avoid overlapping deploys if pushes land close together.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings (incl. ANTHROPIC_API_KEY)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
